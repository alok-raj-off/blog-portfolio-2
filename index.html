<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Premium Event Dice Roller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #181528 0%, #09070f 100%);
      --accent-glow: rgba(139, 92, 246, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      padding: 1.5rem 1rem;
    }

    /* Ambient Background Glow */
    .glow-orb {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 650px;
      height: 90vw;
      max-height: 650px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0, 0, 0, 0) 70%);
      z-index: 0;
      pointer-events: none;
      filter: blur(40px);
    }

    header {
      z-index: 10;
      text-align: center;
      width: 100%;
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      
      text-shadow: 0 10px 30px rgba(192, 132, 252, 0.2);
      color: transparent;
    }

    header p {
      color: #94a3b8;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-weight: 600;
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
      color: transparent;
    }

    /* Responsive 3D Canvas Stage */
    #canvas-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      height: 48vh;
      min-height: 280px;
      max-height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    /* Controls & Results */
    .controls {
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .result-badge {
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: 700;
      color: #e9d5ff;
      height: 32px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
    }

    .result-badge.show {
      opacity: 1;
      transform: translateY(0);
    }

    .spin-btn {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      padding: clamp(0.9rem, 3vw, 1.2rem) clamp(2.5rem, 8vw, 4rem);
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.45);
      transition: all 0.25s ease;
      text-transform: uppercase;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .spin-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 18px 40px rgba(168, 85, 247, 0.6);
    }

    .spin-btn:active {
      transform: translateY(1px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-height: 600px) {
      body {
        padding: 0.8rem 1rem;
      }
      #canvas-container {
        height: 40vh;
        min-height: 220px;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="glow-orb"></div>

  <header>
    <h1>Event Roll</h1>
    <p>Tap SPIN to determine your score</p>
  </header>

  <div id="canvas-container"></div>

  <div class="controls">
    <div class="result-badge" id="result">Landed on 6!</div>
    <button class="spin-btn" id="spinBtn">Spin Dice</button>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    // Function to calculate camera distance depending on screen size
    function updateCameraDistance() {
      const isMobile = window.innerWidth < 600;
      const cameraZ = isMobile ? 9.5 : 7.5;
      camera.position.set(0, 2.5, cameraZ);
      camera.lookAt(0, 0, 0);
    }
    updateCameraDistance();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 8, 6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const purpleSpot = new THREE.PointLight(0xa855f7, 2, 10);
    purpleSpot.position.set(-3, 1, 3);
    scene.add(purpleSpot);

    const shadowPlaneGeo = new THREE.PlaneGeometry(10, 10);
    const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = -1.25;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    const diceGroup = new THREE.Group();

    const diceSize = 2.3;
    const bodyGeo = new THREE.BoxGeometry(diceSize, diceSize, diceSize, 8, 8, 8);
    
    const pos = bodyGeo.attributes.position;
    const v = new THREE.Vector3();
    const cornerRadius = 0.35;

    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const subX = Math.sign(v.x) * Math.max(0, Math.abs(v.x) - (diceSize / 2 - cornerRadius));
      const subY = Math.sign(v.y) * Math.max(0, Math.abs(v.y) - (diceSize / 2 - cornerRadius));
      const subZ = Math.sign(v.z) * Math.max(0, Math.abs(v.z) - (diceSize / 2 - cornerRadius));

      const disp = new THREE.Vector3(subX, subY, subZ);
      if (disp.length() > 0) {
        disp.clampLength(0, cornerRadius);
        v.x = Math.sign(v.x) * (diceSize / 2 - cornerRadius) + disp.x;
        v.y = Math.sign(v.y) * (diceSize / 2 - cornerRadius) + disp.y;
        v.z = Math.sign(v.z) * (diceSize / 2 - cornerRadius) + disp.z;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
    }
    bodyGeo.computeVertexNormals();

    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0xf1f5f9,
      roughness: 0.25,
      metalness: 0.05
    });

    const diceBody = new THREE.Mesh(bodyGeo, bodyMat);
    diceBody.castShadow = true;
    diceBody.receiveShadow = true;
    diceGroup.add(diceBody);

    const dotGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.08, 24);
    const dotMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      roughness: 0.2
    });

    const half = diceSize / 2 - 0.02;
    const offset = 0.55;

    const dotLayouts = {
      1: [[0, 0]],
      2: [[-offset, -offset], [offset, offset]],
      3: [[-offset, -offset], [0, 0], [offset, offset]],
      4: [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]],
      5: [[-offset, -offset], [offset, -offset], [0, 0], [-offset, offset], [offset, offset]],
      6: [[-offset, -offset], [offset, -offset], [-offset, 0], [offset, 0], [-offset, offset], [offset, offset]]
    };

    // Face 1 (+Z)
    dotLayouts[1].forEach(([x, y]) => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.x = Math.PI / 2;
      dot.position.set(x, y, half);
      diceGroup.add(dot);
    });

    // Face 6 (-Z)
    dotLayouts[6].forEach(([x, y]) => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.x = -Math.PI / 2;
      dot.position.set(x, y, -half);
      diceGroup.add(dot);
    });

    // Face 2 (+X)
    dotLayouts[2].forEach(([y, z]) => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.z = -Math.PI / 2;
      dot.position.set(half, y, z);
      diceGroup.add(dot);
    });

    // Face 5 (-X)
    dotLayouts[5].forEach(([y, z]) => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.z = Math.PI / 2;
      dot.position.set(-half, y, z);
      diceGroup.add(dot);
    });

    // Face 3 (+Y)
    dotLayouts[3].forEach(([x, z]) => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.set(x, half, z);
      diceGroup.add(dot);
    });

    // Face 4 (-Y)
    dotLayouts[4].forEach(([x, z]) => {
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.x = Math.PI;
      dot.position.set(x, -half, z);
      diceGroup.add(dot);
    });

    const groundedY = -1.25 + (diceSize / 2);
    diceGroup.position.y = groundedY;
    scene.add(diceGroup);

    let isSpinning = false;
    const spinDuration = 5.0;
    let startTime = 0;

    let startRotation = new THREE.Euler();
    let targetRotation = new THREE.Euler();

    const faceRotations = {
      1: { x: 0, y: 0, z: 0 },
      6: { x: 0, y: Math.PI, z: 0 },
      2: { x: 0, y: -Math.PI / 2, z: 0 },
      5: { x: 0, y: Math.PI / 2, z: 0 },
      3: { x: Math.PI / 2, y: 0, z: 0 },
      4: { x: -Math.PI / 2, y: 0, z: 0 }
    };

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    const spinBtn = document.getElementById('spinBtn');
    const resultBadge = document.getElementById('result');

    function startSpin() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;
      resultBadge.classList.remove('show');

      const rolledValue = Math.floor(Math.random() * 6) + 1;
      const target = faceRotations[rolledValue];

      startRotation.copy(diceGroup.rotation);

      const extraTurnsX = (Math.floor(Math.random() * 3) + 6) * Math.PI * 2;
      const extraTurnsY = (Math.floor(Math.random() * 3) + 6) * Math.PI * 2;
      const extraTurnsZ = (Math.floor(Math.random() * 2) + 4) * Math.PI * 2;

      targetRotation.set(
        startRotation.x + extraTurnsX + target.x - (startRotation.x % (Math.PI * 2)),
        startRotation.y + extraTurnsY + target.y - (startRotation.y % (Math.PI * 2)),
        startRotation.z + extraTurnsZ + target.z - (startRotation.z % (Math.PI * 2))
      );

      startTime = performance.now();
      window.lastRolledValue = rolledValue;
    }

    spinBtn.addEventListener('click', startSpin);

    function animate(now) {
      requestAnimationFrame(animate);

      if (isSpinning) {
        const elapsed = (now - startTime) / 1000;
        const spinProgress = Math.min(elapsed / spinDuration, 1);
        const easeFactor = easeOutCubic(spinProgress);

        diceGroup.rotation.x = startRotation.x + (targetRotation.x - startRotation.x) * easeFactor;
        diceGroup.rotation.y = startRotation.y + (targetRotation.y - startRotation.y) * easeFactor;
        diceGroup.rotation.z = startRotation.z + (targetRotation.z - startRotation.z) * easeFactor;

        const bounceHeight = Math.abs(Math.sin(spinProgress * Math.PI * 7)) * (1 - easeFactor) * 1.5;
        diceGroup.position.y = groundedY + bounceHeight;

        if (spinProgress >= 1) {
          isSpinning = false;
          diceGroup.position.y = groundedY;
          resultBadge.textContent = `You rolled a ${window.lastRolledValue}!`;
          resultBadge.classList.add('show');
          spinBtn.disabled = false;
        }
      } else {
        diceGroup.position.y = groundedY;
      }

      renderer.render(scene, camera);
    }

    animate(performance.now());

    // Responsive Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      updateCameraDistance();
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
